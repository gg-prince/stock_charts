# Lb01: /etc/haproxy/haproxy.cfg
global
    log /dev/log local0
    maxconn 2000

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2

frontend http_in
    bind *:80
    default_backend ea_web

backend ea_web
    balance roundrobin
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    option httpchk GET /health
    http-check expect status 200
    http-response set-header X-Lb-Served-By %s
    server web01 18.170.32.219:3000 check inter 5s fall 2 rise 2
    server web02 18.170.99.250:3000 check inter 5s fall 2 rise 2

# Optional: spread SSH screener sessions too (ssh -p 2222 stocks@35.178.51.220)
frontend ssh_in
    mode tcp
    option tcplog
    bind *:2222
    timeout client 1h
    default_backend ea_ssh

backend ea_ssh
    mode tcp
    balance roundrobin
    timeout server 1h
    server web01 18.170.32.219:22 check
    server web02 18.170.99.250:22 check
